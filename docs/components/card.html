<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Card · BLUESOFT Design System</title>
<link rel="stylesheet" href="../assets/main.css" />
<link rel="stylesheet" href="../assets/docs.css" />
</head>
<body>

<nav class="doc-sidebar" id="sidebar-mount"></nav>

<main class="doc-main">
  <div class="doc-breadcrumb"><a href="../index.html">데이터 컴포넌트</a> / Card</div>
  <div class="doc-page-header">
    <h1>Card</h1>
    <p>Orientation 2종(vertical/horizontal) × Style 3종(default/outline/tinted) = 6 조합. hover(border-hover 등장)는 정적 페이지로 재현할 수 없는 상호작용 상태라 제외합니다.</p>
  </div>

  <section class="doc-section">
    <h2>Orientation × Style</h2>
    <p class="doc-desc">Default=box-shadow만, Outline=card/border 1px, Tinted=card/bg-tinted 배경(보더·섀도 없음) — 컴포넌트 설명에 명시된 3-Style 구분입니다.</p>
    <div class="doc-matrix doc-matrix-wide" id="card-matrix"></div>
  </section>
</main>

<script>window.DOCS_BASE = '../';</script>
<script src="../assets/nav.js"></script>
<script>
  var ORIENTATIONS = ['vertical', 'horizontal'];
  var STYLES = ['default', 'outline', 'tinted'];

  function cardBody() {
    return '' +
      '<div class="card__body">' +
      '<div class="card__content">' +
      '<span class="card__eyebrow">CATEGORY</span>' +
      '<h3 class="card__title">카드 제목이 들어가는 영역</h3>' +
      '<p class="card__description">카드 설명 텍스트가 한두 줄 정도 들어가는 영역입니다.</p>' +
      '</div>' +
      '<span class="card__meta">2026.08.28</span>' +
      '<div class="card__action"><button class="btn btn-sm btn-outline">자세히 보기</button></div>' +
      '</div>';
  }

  (function () {
    var el = document.getElementById('card-matrix');
    ORIENTATIONS.forEach(function (orientation) {
      STYLES.forEach(function (style) {
        var cell = document.createElement('div');
        cell.className = 'doc-cell';
        cell.style.width = '100%';
        var mediaStyle = orientation === 'horizontal'
          ? 'background:var(--color-neutral-100);width:160px;flex-shrink:0;height:200px;'
          : 'background:var(--color-neutral-100);width:100%;height:200px;';
        cell.innerHTML =
          '<div class="card card-' + orientation + ' card-' + style + '" style="width:100%;">' +
          '<div class="card__media" style="' + mediaStyle + '"></div>' +
          cardBody() +
          '</div>' +
          '<span class="doc-cell__caption">card card-' + orientation + ' card-' + style + '</span>';
        el.appendChild(cell);
      });
    });
  })();
</script>
</body>
</html>
