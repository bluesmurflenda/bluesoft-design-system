<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chip · BLUESOFT Design System</title>
<link rel="stylesheet" href="../assets/main.css" />
<link rel="stylesheet" href="../assets/docs.css" />
</head>
<body>

<nav class="doc-sidebar" id="sidebar-mount"></nav>

<main class="doc-main">
  <div class="doc-breadcrumb"><a href="../index.html">기본 컴포넌트</a> / Chip</div>
  <div class="doc-page-header">
    <h1>Chip</h1>
    <p>색상 6종(brand/neutral/success/warning/error/info) × 사이즈 3(sm/md/lg) = 18. Dot 슬롯(<code>.chip__dot</code>)은 색상 축과 무관하게 사이즈별 1종씩 별도로 확인합니다(brand 기준 3개, 위 18과 별도).</p>
  </div>

  <section class="doc-section">
    <h2>Color × Size</h2>
    <div class="doc-matrix" id="chip-matrix"></div>
  </section>

  <section class="doc-section">
    <h2>Dot 슬롯</h2>
    <p class="doc-desc"><code>.chip__dot</code>을 라벨 앞에 추가한 형태 — 사이즈별 dot 지름(sm/md 6px, lg 8px)만 다릅니다.</p>
    <div class="doc-card doc-row" id="chip-dot-demo"></div>
  </section>
</main>

<script>window.DOCS_BASE = '../';</script>
<script src="../assets/nav.js"></script>
<script>
  var COLORS = ['brand', 'neutral', 'success', 'warning', 'error', 'info'];
  var SIZES = ['sm', 'md', 'lg'];
  var LABEL_TEXT = { brand: 'Brand', neutral: 'Neutral', success: 'Success', warning: 'Warning', error: 'Error', info: 'Info' };

  (function () {
    var el = document.getElementById('chip-matrix');
    COLORS.forEach(function (color) {
      SIZES.forEach(function (size) {
        var cell = document.createElement('div');
        cell.className = 'doc-cell';
        cell.innerHTML = '<span class="chip chip-' + size + ' chip-' + color + '">' + LABEL_TEXT[color] + '</span>' +
          '<span class="doc-cell__caption">chip-' + size + ' chip-' + color + '</span>';
        el.appendChild(cell);
      });
    });
  })();

  (function () {
    var el = document.getElementById('chip-dot-demo');
    SIZES.forEach(function (size) {
      var wrap = document.createElement('div');
      wrap.className = 'doc-cell';
      wrap.innerHTML = '<span class="chip chip-' + size + ' chip-brand"><span class="chip__dot"></span><span>Brand</span></span>' +
        '<span class="doc-cell__caption">chip-' + size + ' chip-brand + .chip__dot</span>';
      el.appendChild(wrap);
    });
  })();
</script>
</body>
</html>
