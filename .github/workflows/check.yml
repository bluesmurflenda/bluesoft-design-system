name: check

# push·pull_request 마다 돈다.
# 같은 저장소 브랜치는 두 이벤트가 겹치지만, 포크 PR 은 push 가 안 오므로 둘 다 필요하다.
on:
  push:
  pull_request:

permissions:
  contents: read

# 같은 ref 에 새 push 가 오면 앞 실행을 취소한다 — 마지막 결과만 의미가 있다.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 버전은 .nvmrc 한 곳에서만 정한다. 여기 숫자를 또 적으면 둘이 갈린다.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # S1~S9. 로컬 파일과 figma/tokens.*.json 스냅샷만 보므로 시크릿이 필요 없다 — 항상 돈다.
      # 「쓰이지 않는 예외」(S9)가 여기서 매번 돈다. 0 건이 아니면 스크립트가 직접 ::warning 을
      # 내므로 실행 요약에 뜬다 — 로그를 grep 하지 않는다(문구가 바뀌면 조용히 깨지니까).
      - name: 'check:tokens — SCSS·스냅샷 대조 (S1~S9)'
        run: npm run check:tokens

      # prebuild(아이콘) → sass → postbuild(docs 산출물)까지 돈다.
      - name: 'build — 컴파일 + 문서 산출물'
        run: npm run build

      # D1~D15. Figma REST 를 부르므로 토큰과 파일 키가 둘 다 있어야 한다.
      # 없으면 건너뛴다 — SCSS.md 「완료 판정」이 정한 의도된 동작이고 실패가 아니다.
      # 건너뜀과 통과를 로그와 실행 요약 양쪽에서 구분해 낸다.
      - name: 'check:nodes — Figma 노드 검사 (D1~D15)'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          # 파일 키는 CLAUDE.md 에 공개돼 있어 시크릿이 아니다 — 저장소 변수가 맞는 자리다.
          # 시크릿으로 넣어 둔 경우도 받아준다.
          FIGMA_FILE_KEY: ${{ vars.FIGMA_FILE_KEY || secrets.FIGMA_FILE_KEY }}
        run: |
          missing=""
          if [ -z "$FIGMA_TOKEN" ]; then missing="$missing FIGMA_TOKEN(시크릿)"; fi
          if [ -z "$FIGMA_FILE_KEY" ]; then missing="$missing FIGMA_FILE_KEY(변수 또는 시크릿)"; fi

          if [ -n "$missing" ]; then
            echo "::notice title=check:nodes 건너뜀::없는 설정:$missing — SCSS.md 「완료 판정」이 정한 동작이다. 실패가 아니다."
            echo "건너뜀 — 통과가 아니다. 없는 설정:$missing"
            echo "이번 실행에서 판정하지 않은 것: D1 · D2 · D10 · D14,"
            echo "그리고 D15 — D1_NODE_EXCEPTIONS 가 죽었는지 못 본다(S9 는 코드 쪽 목록만 본다)."
            {
              echo '### check:nodes — 건너뜀 (통과가 아니다)'
              echo ''
              echo "없는 설정:$missing"
              echo ''
              echo '판정하지 않음: D1 · D2 · D10 · D14 · D15.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npm run check:nodes
          echo "실행함 — D1 · D2 · D10 · D14 · D15 를 판정했다."
          {
            echo '### check:nodes — 실행함'
            echo ''
            echo 'D1 · D2 · D10 · D14 · D15 를 판정했다.'
          } >> "$GITHUB_STEP_SUMMARY"
